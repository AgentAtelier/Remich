[package]
name = "remich_core"
version.workspace = true
edition.workspace = true
description = "Engine-free simulation core: the firewall side (docs/PLAN.md §1.2)."
publish = false

[dependencies]
# No engine dependency, ever: simulation cores stay plain Rust and the thin
# binding above this crate is the only place engine types may appear
# (docs/PLAN.md §1.2). Since Step 4 this crate also depends on the Step 3
# donor import `anvil_sim` — which is engine-free too — because the adapter's
# whole job is to call the donor scorer rather than re-implement it.
anvil_sim = { path = "../anvil_sim" }

# Serialization for the game's save (Phase 2, Step 3): plain data only, and
# engine-free like everything else in this crate. Versions come from the
# workspace's shared dependency table.
serde = { workspace = true }
serde_json = { workspace = true }
